name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ARM symbolizer
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - name: Install project
        run: python -m pip install '.[test]'
      - name: Test backend
        env:
          DIAG_ADDR2LINE: arm-none-eabi-addr2line
        run: python -m pytest service/tests -q
      - name: Test gateway
        run: python -m unittest discover -s host/tests -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validate Compose
        env:
          DIAG_SERVICE_TOKEN: integration-test-token-12345
        run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build -f service/Dockerfile -t zephyr-diagnostics:test .
