[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyr-diagnostic-service"
version = "0.1.0"
description = "Self-hosted ingestion and ELF analysis for Zephyr diagnostics"
readme = "docs/SERVICE.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyelftools>=0.31,<1",
]

[project.optional-dependencies]
gateway = [
  "bleak>=2.1,<3",
  "smpclient>=7.3,<8",
]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
zephyr-diag-service = "service.cli:main"

[tool.setuptools]
packages = ["service"]
