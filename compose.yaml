services:
  diagnostics:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      DIAG_SERVICE_TOKEN: ${DIAG_SERVICE_TOKEN:?Set a random service token}
      DIAG_SERVICE_DATA: /data
      DIAG_ADDR2LINE: arm-none-eabi-addr2line
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - diagnostic-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  diagnostic-data:
